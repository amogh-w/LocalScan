[server]
host = "0.0.0.0"
port = 8010          # 8000 is taken by the PaddleOCR server in Projects/Paddle
data_dir = "data"

[ocr]
engine = "paddle_local"   # "paddle_local" (in-process, needs: uv sync --extra paddle) or "paddle_http"

[ocr.paddle_local]
lang = ""            # empty = PaddleOCR default models (the PP-OCRv6 ones already in ~/.paddlex)
device = "gpu"

[ocr.paddle_http]
url = "http://localhost:8000/ocr"
# How to send the image:
#   "multipart" - form field "file" (Projects/Paddle server.py)
#   "paddlex"   - PaddleX serving, JSON {"file": <b64>, "fileType": 1}
#   "paddlehub" - PaddleHub serving, JSON {"images": [<b64>]}
request = "multipart"
timeout = 120

[languages]            # codes from backend/app/languages.py; changed on the Settings page
scan = ["de"]          # the languages your letters may be written in (one or more)
translate_to = "en"    # the language of translations and AI names

[translator]
engine = "ollama"

[translator.ollama]
url = "http://localhost:11434"
model = ""          # empty = first installed model; change it on the Settings page
temperature = 0.1
timeout = 600

[images]
max_edge = 0          # longest side of an uploaded photo in px; 0 = keep every pixel
resize_quality = 92   # JPEG quality, used only when a photo is resized or converted (PNG, rotated by EXIF...)
page_dpi = 300        # resolution of the cleaned page: A4 long edge = dpi x 11.69 px
page_quality = 92     # JPEG quality of the cleaned page that is stored

[export]
preset = "standard"   # archive | standard | small | custom (custom uses dpi and quality below)
dpi = 300
quality = 88

# Helper programs the Settings page can start and stop (nothing starts by itself).
[services.ollama]
command = "ollama"   # found on PATH, or in %LOCALAPPDATA%\Programs\Ollama

[services.paddle_server]   # your separate PaddleOCR server, used only when ocr.engine = "paddle_http"
python = "~/miniconda3/envs/paddleocr/python.exe"
cwd = "~/Projects/Paddle"
