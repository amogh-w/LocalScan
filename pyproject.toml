[project]
name = "local-scan"
version = "0.1.0"
description = "Local document scanner and DE->EN PDF translator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "opencv-python-headless>=4.10",  # cv2 (rapidocr asks for this build too)
    "numpy>=2.0",
    "pymupdf>=1.25",
    "pillow>=11.0",
    "python-multipart>=0.0.12",
    "qrcode>=8.0",
    "psutil>=6.0",  # find and stop the helper services (services.py)
    "pystray>=0.19",  # the system-tray icon (scripts/tray.py)
    "rapidocr>=3.10",  # PaddleOCR models on ONNX Runtime (ocr.engine = "rapid")
    # DirectML build: runs on the GPU through DirectX 12, without CUDA or cuBLAS (CUDA's cuBLAS crashes natively on
    # this PC). It also has the CPU provider. Never install plain onnxruntime next to it.
    "onnxruntime-directml>=1.24",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]  # runs on the Windows PC with the GPU

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
