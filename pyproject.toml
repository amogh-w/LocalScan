[project]
name = "local-scan"
version = "0.1.0"
description = "Local document scanner and DE->EN PDF translator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "opencv-contrib-python>=4.10",  # same cv2 build paddlex uses, so the two never clash
    "numpy>=2.0",
    "pymupdf>=1.25",
    "pillow>=11.0",
    "python-multipart>=0.0.12",
    "qrcode>=8.0",
    "psutil>=6.0",  # find and stop the helper services (services.py)
    "pystray>=0.19",  # the system-tray icon (scripts/tray.py)
]

[project.optional-dependencies]
# In-process PaddleOCR on the GPU (ocr.engine = "paddle_local"). Install with: uv sync --extra paddle
paddle = [
    "paddleocr==3.7.0",
    "paddlepaddle-gpu==3.3.1",
    # CUDA 12.9 runtime DLLs. Paddle's Windows wheel doesn't declare them, so they are listed here,
    # at the versions its Linux wheel pins. The cu129 build is needed for RTX 50xx (Blackwell, sm_120):
    # the cu126 build runs there but returns garbage text.
    "nvidia-cublas-cu12==12.9.0.13",
    "nvidia-cuda-runtime-cu12==12.9.37",
    "nvidia-cuda-nvrtc-cu12==12.9.41",
    "nvidia-cudnn-cu12==9.9.0.52",
    "nvidia-cufft-cu12==11.4.0.6",
    "nvidia-curand-cu12==10.3.10.19",
    "nvidia-cusolver-cu12==11.7.4.40",
    "nvidia-cusparse-cu12==12.5.9.5",
    "nvidia-nvjitlink-cu12==12.9.41",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]  # runs on the Windows PC with the GPU

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129" }

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
