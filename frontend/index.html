<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181825" />
    <link rel="icon" href="/icon.svg" />
    <title>Local Scan</title>
    <!-- The kit's theme.js sets flavor, accent and radius before first paint. The text size is ours (src/theme.ts). -->
    <script>
      try {
        var ts = parseFloat(localStorage.getItem("localscan_text"));
        if (ts > 0) document.documentElement.style.setProperty("--ts", ts);
      } catch (e) {}
    </script>
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/ui.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
